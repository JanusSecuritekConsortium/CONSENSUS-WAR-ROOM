[project]
name = "consensus-war-room"
version = "7.11.9"
description = "Local multi-agent tribunal for proposal review and auditable consensus decisions."
authors = [{ name = "Erhardt Von Grupten Mundt" }]
requires-python = ">=3.10"
readme = "README.md"
dependencies = ["psutil>=5.9", "requests>=2.31", "flet>=0.28.3", "flet-desktop>=0.28.3"]

[project.urls]
Organization = "https://github.com/JanusSecuritekConsortium"

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
