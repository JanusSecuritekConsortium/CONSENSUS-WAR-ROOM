[project]
name = "consensus-war-room"
version = "7.10.14"
description = "Local multi-agent tribunal for proposal review and auditable consensus decisions."
requires-python = ">=3.10"
readme = "README.md"
dependencies = ["psutil>=5.9"]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
