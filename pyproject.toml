[project]
name = "consensus-war-room"
version = "7.13.2"
description = "Local multi-agent tribunal for proposal review and auditable consensus decisions."
authors = [{ name = "Erhardt Von Grupten Mundt" }]
requires-python = ">=3.10"
readme = "README.md"
dependencies = ["psutil>=5.9", "requests>=2.31", "flet>=0.28.3,<0.29", "flet-desktop>=0.28.3,<0.29", "Pillow>=10.0", "openai>=1.0", "python-dotenv>=1.0", "schedule>=1.2", "pyTelegramBotAPI>=4.20"]

[project.urls]
Organization = "https://github.com/JanusSecuritekConsortium"

[project.optional-dependencies]
dev = ["pytest>=8.0", "pyinstaller>=6.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"

[tool.setuptools.packages.find]
where = ["."]
include = [
    "core*",
    "ui*",
    "config*",
    "integrations*",
    "voice*",
    "assistant*",
    "monoliths*",
]
exclude = [
    "archive*",
    "reports*",
    "external*",
    "static*",
    "future_implementations*",
    "tests*",
    "tools*",
    "logs*",
    "cache*",
    ".venv*",
    "venv*",
]
