name: CI

on:
  push:
    branches: ["main", "claude/**"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.10"

      # The Flet desktop client used by the window smoke tests needs GStreamer and libmpv.so.1.
      # Current Ubuntu ships only libmpv.so.2, which Flet 0.28 accepts under the old name.
      - name: Install window test libraries
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libgstreamer1.0-0 libgstreamer-plugins-base1.0-0 libmpv2 xvfb
          mpv="$(ls /usr/lib/x86_64-linux-gnu/libmpv.so.2* | head -1)"
          sudo ln -sf "$mpv" /usr/lib/x86_64-linux-gnu/libmpv.so.1

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
          python -m pip install -r integrations/msty/personal/requirements.txt
          python -m pip install -r integrations/msty/personal/requirements-news.txt
          python -m pip install -r integrations/attention/requirements-chats.txt

      - name: Compile active sources
        run: python consensus_war_room_genesis.py --compile-active

      - name: Run tests
        env:
          CONSENSUS_GUI_TESTS: "1"
        run: xvfb-run -a python -m pytest
