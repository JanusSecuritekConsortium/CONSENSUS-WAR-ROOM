name: CI

on:
  push:
    branches: ["main", "claude/**"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
          python -m pip install -r integrations/msty/personal/requirements.txt
          python -m pip install -r integrations/msty/personal/requirements-news.txt
          python -m pip install -r integrations/attention/requirements-chats.txt

      - name: Compile active sources
        run: python consensus_war_room_genesis.py --compile-active

      - name: Run tests
        run: python -m pytest
